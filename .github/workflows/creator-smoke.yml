name: Dorszolandia smoke tests

on:
  push:
    branches: [main, codex/full-canon-assets-20260909]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recover Atlas payload
        id: recover_atlas
        continue-on-error: true
        run: node tests/recover-atlas.mjs
      - name: Upload Atlas recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-recovery
          path: recovery-output/
          if-no-files-found: warn
          retention-days: 2
      - name: Install Puppeteer
        run: npm install --no-save puppeteer@24
      - name: Run browser smoke suite
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/dorsz-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node tests/creator-smoke.mjs
          node tests/canon-smoke.mjs
          node tests/multipage-smoke.mjs
